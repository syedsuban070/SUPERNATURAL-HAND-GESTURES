name: Android APK
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
concurrency:
  group: android-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Bundle hand model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' -o app/src/main/assets/hand_landmarker.task
          echo 'fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1  app/src/main/assets/hand_landmarker.task' | sha256sum --check
      - name: Build and test
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Generate standard Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: GLES3 device smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.hyperpixelacity.app/.MainActivity
            sleep 3
            adb exec-out screencap -p > app/build/reports/onboarding.png
      - name: Verify APK signature and alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hyperpixelacity-debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload reproducible build wrapper
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: app/build/reports/
